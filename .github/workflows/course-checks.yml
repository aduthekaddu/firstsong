name: Course checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: course-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  course:
    name: Typecheck, unit tests, and browser journey
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - name: Build the GitHub Pages static export
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /firstsong
      - run: ./node_modules/.bin/playwright install --with-deps chromium --only-shell
      - name: Run the course journey with a simulated microphone
        run: npm run test:e2e -- --workers=1
